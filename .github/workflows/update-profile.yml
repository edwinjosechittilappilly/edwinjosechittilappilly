name: Refresh public profile infographics

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: public-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh selected public contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit refreshed profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/profile
          if git diff --cached --quiet; then
            echo 'No profile changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh public contribution infographics'
          git push
