<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1723" viewBox="0 0 960 1723" role="img" aria-labelledby="title description"><title id="title">Edwin Jose: engineering and research profile</title><desc id="description">Edwin Jose, Software Engineer at IBM and Computer Science PhD. Selected public contribution counts: Langflow: 308 merged pull requests; OpenRAG: 258 merged pull requests; Quoptuna: 83 merged pull requests. Selected peer-reviewed publications, architecture practice, recognition and technical toolkit. Full accessible details and paper links are available on the linked portfolio.</desc><rect width="960" height="1723" rx="18" fill="#0c1015"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="91" fill="#f1f5f9" font-size="60" font-weight="700" text-anchor="start">Edwin Jose</text><text x="32" y="139" fill="#8de4c3" font-size="27" font-weight="500" text-anchor="start">AI product &amp; solution architecture</text><text x="32" y="178" fill="#f1f5f9" font-size="19" font-weight="500" text-anchor="start">Software Engineer at IBM</text><text x="32" y="217" fill="#b1bdcd" font-size="18" font-weight="500" text-anchor="start">Computer Science PhD · Western Michigan University</text><text x="32" y="264" fill="#b1bdcd" font-size="17" font-weight="400" text-anchor="start">I connect research, system design and hands-on engineering to turn AI ideas into useful</text><text x="32" y="290" fill="#b1bdcd" font-size="17" font-weight="400" text-anchor="start">software.</text><rect x="32" y="348" width="436.0" height="605" rx="16" fill="#151b23" stroke="#344150"/><text x="56" y="385" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">Engineering in the open</text><text x="56" y="413" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">Merged PRs in selected public projects</text><text x="56" y="455" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">Langflow</text><text x="444.0" y="457" fill="#8de4c3" font-size="31" font-weight="700" text-anchor="end">308</text><text x="56" y="484" fill="#8de4c3" font-size="15" font-weight="500" text-anchor="start">Contributor</text><text x="56" y="512" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Agent systems, MCP integrations, backend</text><text x="56" y="536" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">components and testing.</text><path d="M56 572H444.0" stroke="#344150"/><text x="56" y="607" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">OpenRAG</text><text x="444.0" y="609" fill="#8de4c3" font-size="31" font-weight="700" text-anchor="end">258</text><text x="56" y="636" fill="#8de4c3" font-size="15" font-weight="500" text-anchor="start">Core contributor</text><text x="56" y="664" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Retrieval and orchestration, configuration,</text><text x="56" y="688" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">reproducible environments and developer</text><text x="56" y="712" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">documentation.</text><path d="M56 748H444.0" stroke="#344150"/><text x="56" y="783" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">Quoptuna</text><text x="444.0" y="785" fill="#8de4c3" font-size="31" font-weight="700" text-anchor="end">83</text><text x="56" y="812" fill="#8de4c3" font-size="15" font-weight="500" text-anchor="start">Founder &amp; first-author researcher</text><text x="56" y="840" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Explainable quantum machine learning,</text><text x="56" y="864" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">optimization, backend and interface</text><text x="56" y="888" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">development.</text><rect x="492.0" y="348" width="436.0" height="564" rx="16" fill="#151b23" stroke="#344150"/