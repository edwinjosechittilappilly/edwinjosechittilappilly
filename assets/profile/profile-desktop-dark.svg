ext-anchor="start">Architecture in practice</text><text x="56" y="1056" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">Make the system clear</text><text x="56" y="1082" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Define component responsibilities,</text><text x="56" y="1106" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">interfaces and important trade-offs.</text><text x="56" y="1152" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">Test the uncertain parts</text><text x="56" y="1178" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Use focused proofs of concept and evaluation</text><text x="56" y="1202" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">to guide implementation.</text><text x="56" y="1248" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">Help teams move forward</text><text x="56" y="1274" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Share technical context, mentor contributors</text><text x="56" y="1298" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">and make handoffs understandable.</text><rect x="492.0" y="936" width="436.0" height="410" rx="16" fill="#151b23" stroke="#344150"/><text x="516.0" y="973" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">Recognition &amp; foundation</text><text x="516.0" y="1016" fill="#f1f5f9" font-size="16" font-weight="600" text-anchor="start">IBM Outstanding Technical Achievement Award</text><text x="516.0" y="1043" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">2026</text><text x="516.0" y="1087" fill="#f1f5f9" font-size="16" font-weight="600" text-anchor="start">IBM TCAP Leader Award</text><text x="516.0" y="1114" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">Technical Collaboration Achievement Program,</text><text x="516.0" y="1136" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">2026</text><text x="516.0" y="1180" fill="#f1f5f9" font-size="16" font-weight="600" text-anchor="start">IBM Open Source Strategic Committer</text><text x="516.0" y="1207" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">Open-source stewardship and contribution</text><text x="516.0" y="1251" fill="#f1f5f9" font-size="16" font-weight="600" text-anchor="start">Research foundation</text><text x="516.0" y="1278" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">Computer Science PhD, specializing in Quantum</text><text x="516.0" y="1300" fill="#b1bdcd" font-size="15" font-weight="400" text-anchor="start">Machine Learning.</text><rect x="32" y="1370" width="896" height="283" rx="16" fill="#151b23" stroke="#344150"/><text x="56" y="1407" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start">A toolkit shaped by the problem</text><text x="56.0" y="1452" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">AI workflows</text><text x="56.0" y="1479" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Python, Langflow, LangChain, MCP, Hugging</text><text x="56.0" y="1503" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Face, Transformers</text><text x="492.0" y="1452" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">Services &amp; deployment</text><text x="492.0" y="1479" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">FastAPI, Flask, Docker, AWS, MongoDB</text><text x="56.0" y="1552" fill="#8de4c3" font-size="16" font-weight="700" text-anchor="start">Experiments &amp; optimization</text><text x="56.0" y="1579" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">scikit-learn, TensorFlow, Keras, Optuna,</text><text x="56.0" y="1603" fill="#b1bdcd" font-size="16" font-weight="400" text-anchor="start">Hyperopt, Matplotlib</text><text x="492.0" y="1528" fill="#8de4c3" font-size="16" font-weight="700