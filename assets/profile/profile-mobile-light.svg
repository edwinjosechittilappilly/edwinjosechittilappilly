<svg xmlns="http://www.w3.org/2000/svg" width="420" height="3153" viewBox="0 0 420 3153" role="img" aria-labelledby="title description"><title id="title">Edwin Jose: engineering and research profile</title><desc id="description">Edwin Jose, Software Engineer at IBM and Computer Science PhD. Selected public contribution counts: Langflow: 308 merged pull requests; OpenRAG: 258 merged pull requests; Quoptuna: 83 merged pull requests. Selected peer-reviewed publications, architecture practice, recognition and technical toolkit. Full accessible details and paper links are available on the linked portfolio.</desc><rect width="420" height="3153" rx="18" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="73" fill="#14202b" font-size="42" font-weight="700" text-anchor="start">Edwin Jose</text><text x="20" y="118" fill="#0b6b55" font-size="23" font-weight="500" text-anchor="start">AI product &amp; solution</text><text x="20" y="147" fill="#0b6b55" font-size="23" font-weight="500" text-anchor="start">architecture</text><text x="20" y="185" fill="#14202b" font-size="17" font-weight="500" text-anchor="start">Software Engineer at IBM</text><text x="20" y="223" fill="#506073" font-size="16" font-weight="500" text-anchor="start">Computer Science PhD · Western Michigan</text><text x="20" y="252" fill="#506073" font-size="16" font-weight="500" text-anchor="start">University</text><text x="20" y="298" fill="#506073" font-size="17" font-weight="400" text-anchor="start">I connect research, system design and</text><text x="20" y="324" fill="#506073" font-size="17" font-weight="400" text-anchor="start">hands-on engineering to turn AI ideas</text><text x="20" y="350" fill="#506073" font-size="17" font-weight="400" text-anchor="start">into useful software.</text><rect x="20" y="408" width="380" height="629" rx="16" fill="#ffffff" stroke="#c5ced8"/><text x="44" y="445" fill="#14202b" font-size="22" font-weight="700" text-anchor="start">Engineering in the open</text